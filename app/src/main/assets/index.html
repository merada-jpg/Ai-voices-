<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI Voices</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">AI</span><span>AI Voices</span></div><span class="status"><i></i> يعمل محليًا</span></header><main class="shell"><section class="hero"><p class="eyebrow">VOICE STUDIO</p><h1>حوّل النص إلى <span>صوت</span> في ثوانٍ</h1><p class="sub">اكتب النص، اختر الصوت والسرعة، ثم استمع مباشرة.</p></section><section class="studio"><div class="card editor"><div class="card-head"><span class="label">النص</span><span id="counter">0 / 5000</span></div><textarea id="text" maxlength="5000">مرحبًا بك في AI Voices.</textarea><div class="actions"><button id="speakBtn" class="primary">▶ تشغيل</button><button id="pauseBtn" class="secondary">⏸ إيقاف مؤقت</button><button id="stopBtn" class="secondary">■ إيقاف</button></div></div><aside class="card controls"><span class="label">إعدادات الصوت</span><label>الصوت<select id="voice"></select></label><label>السرعة <output id="rateValue">1.0×</output><input id="rate" type="range" min=".5" max="2" step=".1" value="1"></label><label>حدة الصوت <output id="pitchValue">1.0</output><input id="pitch" type="range" min="0" max="2" step=".1" value="1"></label><label>الصوت <output id="volumeValue">100%</output><input id="volume" type="range" min="0" max="1" step=".05" value="1"></label><div id="support" class="support"></div></aside></section></main><footer>AI Voices · Android</footer><script src="app.js"></script></body></html></html>
